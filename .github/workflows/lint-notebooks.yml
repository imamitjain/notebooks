name: Lint Notebooks

on:
  push:
    paths:
      - "**/*.ipynb"
      - "scripts/lint_notebooks.py"
      - ".github/workflows/lint-notebooks.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint notebooks
        run: python scripts/lint_notebooks.py
